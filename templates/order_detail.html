<h1>Заказ №{{ order.id }}</h1>
<p><strong>Дата заказа:</strong> {{ order.order_date }}</p>
<p><strong>Статус:</strong> {{ order.get_order_status_display }}</p>
<p><strong>Итоговая сумма:</strong> {{ order.total_amount }}</p>
<p><strong>Пользователь:</strong> {{ order.user.username|default:"-" }}</p>
